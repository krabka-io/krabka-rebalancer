name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bazel:
    name: bazel build · test · format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}
      - run: bazel run //tools/format:format.check
      - run: bazel build //...
      - run: bazel test //...

  cargo:
    name: cargo clippy · test · codegen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins
      - name: generated Connect API is current
        run: |
          generated="$(find target/debug/build -path '*/out/krabka.rebalancer.v1.rs' -print -quit)"
          test -n "${generated}"
          cmp "${generated}" crates/rebalancer/src/pb.rs

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  helm:
    name: helm lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.4
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.0 --verify=false
      - run: helm lint charts/krabka-rebalancer --set bootstrapServers=localhost:9092
      - run: helm unittest charts/krabka-rebalancer

  image:
    name: image build · run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-image
          repository-cache: true
      - name: build and run the image
        run: bazel test -c opt --config=docker //packaging:image_docker_test

  # Push the rebalancer image to ghcr.io, tagged with the commit SHA. A `v*` tag
  # later promotes this image by digest. See release.yml. The digest goes into an
  # artifact, so the release promotes the image that this run tested and does not
  # rebuild it.
  delivery:
    name: delivery
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [bazel, cargo, supply-chain, helm, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/krabka-io/krabka-rebalancer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-image
          repository-cache: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: test the delivery image
        run: bazel test -c opt --config=docker //packaging:image_docker_test
      - name: push
        run: bazel run -c opt //packaging:push -- --tag "${GITHUB_SHA}"
      - name: record the delivery image digest
        run: |
          set -euo pipefail
          bazel build -c opt //packaging:image_manifest_blob
          manifest="$(bazel cquery -c opt //packaging:image_manifest_blob --output=files)"
          expected="sha256:$(sha256sum "${manifest}" | cut -d ' ' -f 1)"
          actual="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" |
            awk '$1 == "Digest:" { print $2; exit }')"
          if [ "${actual}" != "${expected}" ]; then
            echo "${IMAGE}:${GITHUB_SHA} is ${actual}, but the build produced ${expected}." >&2
            exit 1
          fi
          echo "${expected}" >delivery-image.digest
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-image
          path: delivery-image.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  gate:
    name: gate
    if: always()
    needs: [bazel, cargo, supply-chain, helm, image]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: test "$(jq '[.[] | select(.result != "success")] | length' <<<"${RESULTS}")" -eq 0
