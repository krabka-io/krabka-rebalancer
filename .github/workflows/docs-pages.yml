name: docs-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish the rustdoc set to GitHub Pages.
#
# This renders the `rust_doc` targets from `main`, adds a landing page that
# lists every crate, and deploys it. It needs the repository's Pages source set
# to "GitHub Actions" (Settings > Pages).
#
# It is its own workflow rather than a job in `ci.yml` because a deployment
# needs `pages: write` and its own concurrency group, and because a failed
# deploy should not turn the merge gate red.

permissions:
  contents: read
  pages: write
  # Both the Pages deployment and setup-aspect's log uploads need the OIDC
  # token, as in `ci.yml`.
  id-token: write

# One deployment at a time. A push that lands while one is in flight waits
# rather than cancelling it, so the site never ends between two versions.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: render rustdoc
    # workflow_dispatch can run from any ref; only main may publish to the
    # production Pages site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}

      - name: docgen
        run: |
          set -euo pipefail
          targets="${RUNNER_TEMP}/rustdoc-targets.txt"
          bazel query 'kind("rust_doc rule", //crates/...)' > "${targets}"
          test -s "${targets}"
          bazel build --target_pattern_file="${targets}"

      - name: assemble the site
        run: aspect rustdoc-site --output site --repo krabka-rebalancer

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    # workflow_dispatch can run from any ref; only main may publish to the
    # production Pages site.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
